name: Android 6 compatibility build

on:
  push:
    branches:
      - feat/android-6-compat
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android6-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android 6 debug APK
        run: ./gradlew assembleDebug

      - name: Confirm APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android 6 test APK
        uses: actions/upload-artifact@v4
        with:
          name: RINXI-android6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
